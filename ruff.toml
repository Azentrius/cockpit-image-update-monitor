# Python checks in CI (ruff check). The root helpers must run on Python 3.8,
# so newer syntax is reported as an error.
target-version = "py38"

[lint]
# Mistakes, not style: pyflakes (unused or undefined names, broken imports)
# and the syntax-level pycodestyle errors. Fixed here so that a newer ruff
# with other defaults does not change what CI checks.
select = ["E4", "E7", "E9", "F"]
