# Dependabot version updates for the test tooling (jsdom in test/).
# The plugin itself has no runtime dependencies.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/test"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      test-dependencies:
        patterns:
          - "*"
