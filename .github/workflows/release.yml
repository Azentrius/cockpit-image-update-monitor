# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, requires the test workflow to have passed for this commit (waiting up to 20
# minutes for it), runs the tests, builds the .deb and .rpm packages and the source archive and
# creates the tag vVERSION with a GitHub release (packages, archive, SHA256SUMS, signed build
# provenance, notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.6.1 (empty: the VERSION in plugin/diun.js)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write       # tag and release
  id-token: write       # signing the build provenance
  attestations: write   # storing the build provenance
  actions: read         # the test workflow's result for this commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sh tools/check-version.sh)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from VERSION in plugin/diun.js ($code). Change plugin/diun.js first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every job of the test workflow on this very commit, not only the required check "test":
      # also the end-to-end test, the installs, the upgrade and the real Cockpit session. The run
      # may still be going, and for a while after it ends the list of runs can show it unfinished
      # or not at all (Update Gaps 0.3.0: 20 seconds after the run ended). So ask every 20 seconds,
      # for at most 20 minutes; a finished run without success stops the release at once.
      - name: The test workflow passed for this commit
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          limit=$(( $(date +%s) + 1200 ))
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status,conclusion,url \
              --jq '.[] | "\(.status)/\(.conclusion) \(.url)"') || run=
            state=${run%% *}
            case $state in
              completed/success)
                echo "The test workflow passed for $GITHUB_SHA: ${run#* }"
                exit 0 ;;
              completed/*)
                echo "::error::The test workflow did not pass for $GITHUB_SHA (${state#completed/}): ${run#* }. Fix it first."
                exit 1 ;;
            esac
            state=${state%/}
            if [ "$(date +%s)" -ge "$limit" ]; then
              echo "::error::The test workflow has not passed for $GITHUB_SHA within 20 minutes (${state:-no run}). Wait for it, then start the release again."
              exit 1
            fi
            echo "Waiting for the test workflow (${state:-no run listed yet})."
            sleep 20
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tests
        run: make check

      # The release acceptance: the helpers against the real Docker Engine of this throw-away
      # runner (test/e2e-server.sh), as in the e2e job of the test workflow.
      - name: End-to-end test on the runner's Docker
        shell: bash
        run: sudo env E2E_LIB="$PWD/lib" bash test/e2e-server.sh 2>&1 | tee e2e.log

      - name: Packages (.deb, .rpm) and source archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
          make dist
          { sha256sum cockpit-image-update-monitor-*.tar.gz; (cd dist && sha256sum *.deb *.rpm); } > SHA256SUMS

      - name: Build provenance for the packages and the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cockpit-image-update-monitor-${{ steps.version.outputs.version }}.tar.gz
            dist/*.deb
            dist/*.rpm

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" > notes.md
          deb=cockpit-image-update-monitor_$(printf '%s' "$VERSION" | tr '-' '~')-1_all.deb
          rpm=cockpit-image-update-monitor-$(printf '%s' "$VERSION" | tr '-' '~')-1.noarch.rpm
          {
            echo
            echo "### Install"
            echo
            echo "From the Azentrius package repository (Debian, Ubuntu, Fedora, RHEL): set up https://packages.azentrius.com once, then install Image Update Monitor in Cockpit under Applications, or with \`sudo apt install cockpit-image-update-monitor\` or \`sudo dnf install cockpit-image-update-monitor\`. The repository takes this release within an hour. It has no openSUSE packages."
            echo
            echo "From the files of this release (every system; on openSUSE the only way): download the package and \`SHA256SUMS\`, check that the download is complete and that this repository's release workflow built it, then install it:"
            echo
            echo '```sh'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo
            echo "sudo apt install ./$deb                              # Debian, Ubuntu"
            echo "sudo dnf install ./$rpm                           # Fedora, RHEL"
            echo "sudo zypper install --allow-unsigned-rpm ./$rpm   # openSUSE"
            echo '```'
            echo
            echo "The \`.rpm\` carries no package signature; the two checks take its place. The package takes over an installation made with install.sh (up to 0.11)."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Image Update Monitor $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" dist/*.deb dist/*.rpm "cockpit-image-update-monitor-$VERSION.tar.gz" SHA256SUMS "$@"
