# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, runs the tests, packs the source and creates the tag
# vVERSION with a GitHub release (tarball, SHA256SUMS, notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.6.1 (empty: the VERSION in plugin/diun.js)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sh tools/check-version.sh)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from VERSION in plugin/diun.js ($code). Change plugin/diun.js first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          cd test
          npm ci
          bash run-all.sh

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=cockpit-image-update-monitor-$VERSION
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > SHA256SUMS

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" > notes.md
          name=cockpit-image-update-monitor-$VERSION
          {
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$name.tar.gz"
            echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/SHA256SUMS"
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "tar -xzf $name.tar.gz && cd $name"
            echo "sudo ./install.sh --dry-run"
            echo "sudo ./install.sh"
            echo '```'
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Image updates monitor $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" "cockpit-image-update-monitor-$VERSION.tar.gz" SHA256SUMS "$@"
