# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, runs the tests, builds the .deb and .rpm packages and the source
# archive and creates the tag vVERSION with a GitHub release (packages, archive, SHA256SUMS,
# signed build provenance, notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.6.1 (empty: the VERSION in plugin/diun.js)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write       # tag and release
  id-token: write       # signing the build provenance
  attestations: write   # storing the build provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sh tools/check-version.sh)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from VERSION in plugin/diun.js ($code). Change plugin/diun.js first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Tests
        run: make check

      - name: Packages (.deb, .rpm) and source archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
          make dist
          { sha256sum cockpit-image-update-monitor-*.tar.gz; (cd dist && sha256sum *.deb *.rpm); } > SHA256SUMS

      - name: Build provenance for the packages and the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cockpit-image-update-monitor-${{ steps.version.outputs.version }}.tar.gz
            dist/*.deb
            dist/*.rpm

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" > notes.md
          deb=cockpit-image-updates_$(printf '%s' "$VERSION" | tr '-' '~')-1_all.deb
          rpm=cockpit-image-updates-$(printf '%s' "$VERSION" | tr '-' '~')-1.noarch.rpm
          {
            echo
            echo "### Install"
            echo
            echo "Debian and Ubuntu: \`sudo apt install ./$deb\`. Fedora, RHEL and openSUSE: \`sudo dnf install ./$rpm\`."
            echo "The package takes over an installation made with install.sh (up to 0.11)."
            echo
            echo "Check the download against \`SHA256SUMS\`, and that it was built by this repository's release workflow:"
            echo
            echo '```sh'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Image updates monitor $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" dist/*.deb dist/*.rpm "cockpit-image-update-monitor-$VERSION.tar.gz" SHA256SUMS "$@"
