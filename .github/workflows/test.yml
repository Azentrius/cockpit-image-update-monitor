name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      - name: Lint (shellcheck, ruff, systemd units)
        run: make lint
      - name: Offline tests (Python helpers, plugin under jsdom, version and changelog)
        run: make check
      - name: Packages (.deb, .rpm) with valid AppStream data, built twice to the same bytes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm appstream > /dev/null
          appstreamcli validate --no-net packaging/*.metainfo.xml
          make packages
          (cd dist && sha256sum *.deb *.rpm) > first.sha256
          rm -rf dist && make packages > /dev/null
          (cd dist && sha256sum -c ../first.sha256)
      # On Debian over what install.sh (up to 0.11) left behind: the package takes it over. The
      # copies of the units: the service runs the old helpers, the radar timer is the same as the
      # package's (both go), the cleanup timer was changed by hand (it stays).
      - name: Install and remove the .deb on Debian and the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/systemd:/units:ro" debian:13 sh -ec '
            mkdir -p /usr/local/lib/diun-radar/backup-1 /usr/share/cockpit/diun
            touch /usr/local/lib/diun-radar/diun-versions.py /usr/share/cockpit/diun/diun.js
            printf "[Service]\nExecStart=/usr/bin/python3 /usr/local/lib/diun-radar/diun-versions.py\n" \
              > /etc/systemd/system/diun-radar.service
            cp /units/diun-radar.timer /etc/systemd/system/
            sed "s/04:40/05:40/" /units/diun-cleanup.timer > /etc/systemd/system/diun-cleanup.timer
            apt-get update -qq
            apt-get install -y -qq /dist/*.deb > /dev/null
            test -x /usr/lib/cockpit-image-updates/diun-deps.sh
            test -f /usr/lib/systemd/system/diun-radar.timer
            test -f /usr/share/cockpit/image-updates/manifest.json
            test -f /usr/share/metainfo/de.azentrius.image_updates.metainfo.xml
            dpkg -L cockpit-image-updates | grep -qx /usr/share/doc/cockpit-image-updates/CC-BY-4.0-Font-Awesome.txt
            test ! -e /usr/share/cockpit/diun
            test ! -e /etc/systemd/system/diun-radar.service
            test ! -e /etc/systemd/system/diun-radar.timer
            grep -q 05:40 /etc/systemd/system/diun-cleanup.timer
            test ! -e /usr/local/lib/diun-radar/diun-versions.py
            test -d /usr/local/lib/diun-radar/backup-1
            /usr/lib/cockpit-image-updates/diun-deps.sh check | python3 -c "import json, sys; json.load(sys.stdin)"
            apt-get remove -y -qq cockpit-image-updates > /dev/null
            test ! -e /usr/share/cockpit/image-updates'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:43 sh -ec '
            dnf install -y -q /dist/*.rpm
            rpm -V cockpit-image-updates
            test -f /usr/share/cockpit/image-updates/manifest.json
            rpm -ql cockpit-image-updates | grep -qx /usr/share/doc/cockpit-image-updates/CC-BY-4.0-Font-Awesome.txt
            dnf remove -y -q cockpit-image-updates
            test ! -e /usr/lib/cockpit-image-updates'
      - name: Browser for the preview
        run: python -m playwright install --with-deps chromium
      - name: Preview in a browser (no JavaScript errors, no sideways scrolling on a phone) and screenshots
        run: |
          python tools/preview/build.py
          python tools/preview/shoot.py test/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/
