name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      - name: Lint (shellcheck, ruff, systemd units)
        run: make lint
      - name: Offline tests (Python helpers, plugin under jsdom, version and changelog)
        run: make check
      - name: Packages (.deb, .rpm) with valid AppStream data, built twice to the same bytes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm appstream > /dev/null
          appstreamcli validate --no-net packaging/*.metainfo.xml
          make packages
          (cd dist && sha256sum *.deb *.rpm) > first.sha256
          rm -rf dist && make packages > /dev/null
          (cd dist && sha256sum -c ../first.sha256)
      - name: Package dependencies name the minimum versions (Cockpit 264, Python 3.8)
        run: |
          dpkg-deb -f dist/*.deb Depends
          test "$(dpkg-deb -f dist/*.deb Depends)" = "cockpit-bridge (>= 264), python3 (>= 3.8)"
          rpm -qp --requires dist/*.rpm | grep -v '^rpmlib('
          rpm -qp --requires dist/*.rpm | grep -qx 'cockpit-bridge >= 264'
          rpm -qp --requires dist/*.rpm | grep -qx 'python3 >= 3.8'
          ! rpm -qp --requires dist/*.rpm | grep -qxE 'cockpit-bridge|python3'
      # On Debian over what install.sh (up to 0.11) left behind: the package takes it over. The
      # copies of the units: the service runs the old helpers, the radar timer is the same as the
      # package's (both go), the cleanup timer was changed by hand (it stays).
      - name: Install and remove the .deb on Debian and the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/systemd:/units:ro" debian:13 sh -ec '
            mkdir -p /usr/local/lib/diun-radar/backup-1 /usr/share/cockpit/diun
            touch /usr/local/lib/diun-radar/diun-versions.py /usr/share/cockpit/diun/diun.js
            printf "[Service]\nExecStart=/usr/bin/python3 /usr/local/lib/diun-radar/diun-versions.py\n" \
              > /etc/systemd/system/diun-radar.service
            cp /units/diun-radar.timer /etc/systemd/system/
            sed "s/04:40/05:40/" /units/diun-cleanup.timer > /etc/systemd/system/diun-cleanup.timer
            apt-get update -qq
            apt-get install -y -qq /dist/*.deb > /dev/null
            test -x /usr/lib/cockpit-image-updates/diun-deps.sh
            test -f /usr/lib/systemd/system/diun-radar.timer
            test -f /usr/share/cockpit/image-updates/manifest.json
            test -f /usr/share/metainfo/de.azentrius.image_updates.metainfo.xml
            dpkg -L cockpit-image-update-monitor | grep -qx /usr/share/doc/cockpit-image-update-monitor/CC-BY-4.0-Font-Awesome.txt
            dpkg -L cockpit-image-update-monitor | grep -qx /usr/share/cockpit/image-updates/CC-BY-4.0-Font-Awesome.txt
            dpkg -s cockpit-image-update-monitor | grep -qx "Conflicts: cockpit-image-updates"
            test ! -e /usr/share/cockpit/diun
            test ! -e /etc/systemd/system/diun-radar.service
            test ! -e /etc/systemd/system/diun-radar.timer
            grep -q 05:40 /etc/systemd/system/diun-cleanup.timer
            test ! -e /usr/local/lib/diun-radar/diun-versions.py
            test -d /usr/local/lib/diun-radar/backup-1
            /usr/lib/cockpit-image-updates/diun-deps.sh check | python3 -c "import json, sys; json.load(sys.stdin)"
            apt-get remove -y -qq cockpit-image-update-monitor > /dev/null
            test ! -e /usr/share/cockpit/image-updates'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:43 sh -ec '
            dnf install -y -q /dist/*.rpm
            rpm -V cockpit-image-update-monitor
            rpm -q --conflicts cockpit-image-update-monitor | grep -qx cockpit-image-updates
            test -f /usr/share/cockpit/image-updates/manifest.json
            rpm -ql cockpit-image-update-monitor | grep -qx /usr/share/doc/cockpit-image-update-monitor/CC-BY-4.0-Font-Awesome.txt
            dnf remove -y -q cockpit-image-update-monitor
            test ! -e /usr/lib/cockpit-image-updates'
      - name: Browser for the preview
        run: python -m playwright install --with-deps chromium
      - name: Preview in a browser (no JavaScript errors, no sideways scrolling on a phone) and screenshots
        run: |
          python tools/preview/build.py
          python tools/preview/shoot.py test/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/

  # The helpers against a real Docker Engine on a throw-away runner: updates and rollbacks,
  # pulls against a local registry, the update lock, tag changes, and every dump restored
  # into a fresh Postgres, MariaDB and MySQL. No other containers run on the runner.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker and Compose on the runner
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      - name: End-to-end test (test/e2e-server.sh as root, helpers from the checkout)
        shell: bash
        run: sudo env E2E_LIB="$PWD/lib" bash test/e2e-server.sh 2>&1 | tee e2e.log
      - name: Keep the end-to-end log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-log
          path: e2e.log

  # The oldest Python the helpers support (README, Requirements): the offline tests of the
  # helpers on Python 3.8, as Debian and RHEL derivatives may still have it.
  python-min:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Helper tests on Python 3.8
        run: |
          docker run --rm -v "$PWD:/src" -w /src/test python:3.8-slim sh -ec '
            python3 --version
            for t in radar_test.py notes_test.py inv_test.py update_test.py major_test.py major_recovery_test.py mariadb_dump_test.py proc_test.py; do python3 "$t" > "/tmp/$t.log" || { cat "/tmp/$t.log"; exit 1; }; echo "PASS $t"; done'

  # The packages on more distributions than the test job: install (the package manager
  # resolves the dependencies from the distribution, the versions it took are printed), the
  # helpers answer, removal. An installed package is not yet a supported system (README,
  # Supported systems). And two systems below the minimums, which must refuse the package:
  # Ubuntu 20.04 (Cockpit 215) and Rocky Linux 8 (python3 is 3.6).
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb }
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "rockylinux/rockylinux:9", kind: rpm }
          - { image: "rockylinux/rockylinux:10", kind: rpm }
          - { image: "almalinux:9", kind: rpm }
          - { image: "almalinux:10", kind: rpm }
          - { image: "opensuse/leap:16.0", kind: zypper }
          - { image: "ubuntu:20.04", kind: deb, refused: "cockpit-bridge (>= 264)" }
          - { image: "rockylinux/rockylinux:8", kind: rpm, refused: "python3 >= 3.8" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
      - name: Install, check and remove on ${{ matrix.image }}
        if: ${{ !matrix.refused }}
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
        run: |
          docker run --rm -e KIND -v "$PWD/dist:/dist:ro" "$IMAGE" sh -ec '
            # The openSUSE mirrors refuse a file now and then (HTTP 403) or stall a download:
            # zypper then skips the whole repository, or gives up an install after minutes with
            # exit 4 and, under --quiet, without saying why. So every zypper step that downloads
            # gets up to three tries, 15 s apart. A failed try prints the errors zypper logged
            # during it (levels 3 to 5 of /var/log/zypper.log, thrown exceptions included).
            tries() {
              what=$1; shift
              for try in 1 2 3; do
                seen=$(cat /var/log/zypper.log 2> /dev/null | wc -l)
                rc=0; "$@" || rc=$?
                [ "$rc" != 0 ] || return 0
                echo "$what failed with exit code $rc (try $try of 3), errors zypper logged during it:"
                tail -n +"$((seen + 1))" /var/log/zypper.log | grep " <[3-5]> " | tail -n 20 | cut -c 1-300 || true
                [ "$try" -lt 3 ] || exit "$rc"
                echo "trying again in 15 s"; sleep 15
              done
            }
            case "$KIND" in
              deb) apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/*.deb > /dev/null
                   dpkg-query -W cockpit-bridge python3 ;;
              rpm) dnf install -y -q /dist/*.rpm
                   rpm -q cockpit-bridge python3 ;;
              zypper) # Refresh first, then install from the refreshed metadata without refreshing again.
                      tries "zypper refresh" zypper --non-interactive --quiet refresh
                      tries "zypper install" zypper --non-interactive --quiet --no-refresh install --allow-unsigned-rpm /dist/*.rpm
                      rpm -q cockpit-bridge; rpm -q --whatprovides python3 ;;
            esac
            python3 --version
            test -f /usr/share/cockpit/image-updates/manifest.json
            test -f /usr/lib/cockpit-image-updates/diunnotes.py
            test -f /usr/lib/cockpit-image-updates/diunproc.py
            test -f /usr/lib/cockpit-image-updates/diunstatus.py
            /usr/lib/cockpit-image-updates/diun-deps.sh check | python3 -c "import json, sys; json.load(sys.stdin)"
            # The status for the Status Board, as root and without root (nobody): no status.json yet,
            # so state none with the reason. Without -B, as on a server: the run as root leaves
            # __pycache__ in the package folder, which no package owns; the removal takes it along.
            for who in root nobody; do
              python3 -c "import os, sys; sys.argv[1] == \"root\" or (os.setgroups([]), os.setgid(65534), os.setuid(65534)); os.execv(sys.executable, [sys.executable, \"/usr/lib/cockpit-image-updates/diun-update.py\", \"status\", \"--lang\", \"de\"])" "$who" |
                python3 -c "import json, sys; d = json.load(sys.stdin); assert (d[\"schema\"], d[\"addon\"], d[\"state\"], d[\"items\"]) == (1, \"image-updates\", \"none\", []), d; print(sys.argv[1] + \": \" + d[\"summary\"])" "$who"
            done
            test -d /usr/lib/cockpit-image-updates/__pycache__
            python3 -c "import json; m = json.load(open(\"/usr/share/cockpit/image-updates/manifest.json\")); assert m[\"azentrius\"][\"status\"] == [\"/usr/lib/cockpit-image-updates/diun-update.py\", \"status\"], m"
            # skopeo as the page installs it (apt-get, dnf or zypper, from the distribution). On
            # openSUSE it comes from the same mirrors, so it gets the same tries; the helper itself
            # does not retry, on a server the page shows its output and the user can try again.
            mkdir -p /run/lock
            install_skopeo() {
              /usr/lib/cockpit-image-updates/diun-deps.sh install skopeo > /tmp/skopeo.log 2>&1 && return 0
              rc=$?; cat /tmp/skopeo.log; return "$rc"
            }
            if [ "$KIND" = zypper ]; then tries "skopeo install" install_skopeo; else install_skopeo; fi
            skopeo --version
            case "$KIND" in
              deb) apt-get remove -y -qq cockpit-image-update-monitor > /dev/null ;;
              rpm) dnf remove -y -q cockpit-image-update-monitor ;;
              zypper) zypper --non-interactive --quiet remove cockpit-image-update-monitor ;;
            esac
            test ! -e /usr/lib/cockpit-image-updates'
      - name: ${{ matrix.image }} refuses the package (${{ matrix.refused }})
        if: ${{ matrix.refused }}
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
          REFUSED: ${{ matrix.refused }}
        run: |
          docker run --rm -e KIND -e REFUSED -v "$PWD/dist:/dist:ro" "$IMAGE" sh -c '
            case "$KIND" in
              deb) apt-get update -qq
                   apt-cache policy cockpit-bridge python3 | grep -E "^[a-z]|Candidate"
                   DEBIAN_FRONTEND=noninteractive apt-get install -y /dist/*.deb > /tmp/out 2>&1 ;;
              rpm) dnf -q list --available cockpit-bridge python3 2>&1 | tail -n +1
                   dnf install -y -q /dist/*.rpm > /tmp/out 2>&1 ;;
            esac
            rc=$?
            cat /tmp/out
            if [ "$rc" = 0 ]; then echo "installed although $REFUSED is not met"; exit 1; fi
            grep -qF "$REFUSED" /tmp/out || { echo "refused, but not for $REFUSED"; exit 1; }
            test ! -e /usr/lib/cockpit-image-updates
            echo "refused as it must be: $REFUSED"'

  # An upgrade over a published release, and the removal, on Debian 13, Fedora 43 and the RHEL
  # rebuilds Rocky Linux and AlmaLinux 9 and 10 (test/package-upgrade.sh). The release is the
  # newest one older than this build by Semantic Versioning, not a draft or pre-release, with
  # packages (tools/upgrade-base.sh): a build of a version that is released already upgrades
  # from the release before it. Its files are checked against its SHA256SUMS and its build
  # provenance first. Without such a release there is no upgrade to test: the job says so
  # (warning, summary) and checks a fresh install of this build instead.
  upgrade:
    name: upgrade (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:13", kind: deb }
          - { image: "fedora:43", kind: rpm }
          - { image: "rockylinux/rockylinux:9", kind: rpm }
          - { image: "rockylinux/rockylinux:10", kind: rpm }
          - { image: "almalinux:9", kind: rpm }
          - { image: "almalinux:10", kind: rpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages of this build and of the release to upgrade from
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
          version=$(sh tools/check-version.sh)
          out=$(sh tools/upgrade-base.sh prev)
          printf '%s\nversion=%s\n' "$out" "$version" >> "$GITHUB_OUTPUT"
          base=$(printf '%s\n' "$out" | sed -n 's/^BASE=//p')
          echo "Upgrade test on $IMAGE: ${base:-no older release with packages, only a fresh install} -> $version (this build)" >> "$GITHUB_STEP_SUMMARY"
          ls -l prev dist
      - name: Upgrade and remove on ${{ matrix.image }}
        env:
          BASE: ${{ steps.base.outputs.BASE }}
          VERSION: ${{ steps.base.outputs.version }}
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
        run: |
          docker run --rm -e BASE -e VERSION -v "$PWD/dist:/dist:ro" -v "$PWD/prev:/prev:ro" \
            -v "$PWD/test/package-upgrade.sh:/package-upgrade.sh:ro" "$IMAGE" sh /package-upgrade.sh "$KIND"

  # The add-on in a real Cockpit with systemd and Docker, on this throw-away runner and never
  # on a server with real containers (test/cockpit-setup.sh, test/cockpit-session.py,
  # Playwright with Chromium): this build installed with apt over the newest older release,
  # the page reloaded and logged in again after that upgrade; the page in Cockpit's menu,
  # loaded without JavaScript or resource errors; with and without administrative access;
  # skopeo and the radar set up from the page, then a radar run; on a throw-away compose
  # project an update with its plan, live output and result, and its rollback. Versions,
  # steps and results: the job summary and the artifact cockpit-session (with screenshots).
  cockpit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cockpit, the packages of this build and of the release to upgrade from
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cockpit-ws cockpit-system cockpit-bridge rpm > /dev/null
          sudo systemctl start cockpit.socket
          make packages
          sh tools/upgrade-base.sh prev >> "$GITHUB_ENV"
          {
            echo "NEW_VERSION=$(sh tools/check-version.sh)"
            echo "NEW_DEB=$(ls "$PWD"/dist/*.deb)"
            echo "OLD_DEB=$(ls "$PWD"/prev/*.deb 2> /dev/null || true)"
          } >> "$GITHUB_ENV"
      - name: Browser (Playwright, pinned in test/requirements.txt)
        run: |
          pip install -q -r test/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Two users and a throw-away compose project
        run: |
          admin_pw=$(openssl rand -hex 16)
          plain_pw=$(openssl rand -hex 16)
          echo "::add-mask::$admin_pw"
          echo "::add-mask::$plain_pw"
          printf 'ADMIN_USER=imgadmin\nADMIN_PW=%s\nPLAIN_USER=imgplain\nPLAIN_PW=%s\n' "$admin_pw" "$plain_pw" >> "$GITHUB_ENV"
          sudo env ADMIN_USER=imgadmin ADMIN_PW="$admin_pw" PLAIN_USER=imgplain PLAIN_PW="$plain_pw" \
            sh test/cockpit-setup.sh >> "$GITHUB_ENV"
          sudo passwd -S imgadmin
          sudo passwd -S imgplain
          # Cockpit's own login (the same request its login page makes) for both users.
          for user_pw in "imgadmin:$admin_pw" "imgplain:$plain_pw"; do
            code=$(curl -sk -u "$user_pw" -o /dev/null -w '%{http_code}' https://localhost:9090/cockpit/login)
            echo "login ${user_pw%%:*}: HTTP $code"
            if [ "$code" != 200 ]; then
              sudo journalctl --no-pager -n 60 | grep -iE "cockpit|pam|auth" || true
              exit 1
            fi
          done
      - name: The add-on in Cockpit (test/cockpit-session.py)
        run: python test/cockpit-session.py cockpit-session
      - name: Report and logs
        if: always()
        run: |
          mkdir -p cockpit-session
          [ ! -f cockpit-session/report.md ] || cat cockpit-session/report.md >> "$GITHUB_STEP_SUMMARY"
          sudo journalctl --no-pager -n 2000 > cockpit-session/journal.txt || true
      - name: Keep screenshots, report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cockpit-session
          path: cockpit-session/

  # Secrets in the files and in the whole history (gitleaks, pinned with its checksum). The
  # findings are redacted in the log; GitHub's own secret scanning with push protection runs
  # as well (repository settings).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.21.2 over the history and the files
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --verbose .
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .
