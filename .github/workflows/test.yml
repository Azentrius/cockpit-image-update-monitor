name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Offline tests (Python helpers, plugin under jsdom, version and changelog)
        run: |
          cd test
          npm ci
          bash run-all.sh
      - name: Installer into a staging directory
        run: DESTDIR="$RUNNER_TEMP/stage" bash install.sh
