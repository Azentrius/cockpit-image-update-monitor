name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      - name: Lint (shellcheck, ruff)
        run: |
          shellcheck --severity=warning lib/*.sh install.sh test/*.sh tools/*.sh
          ruff check .
      - name: Offline tests (Python helpers, plugin under jsdom, version and changelog)
        run: |
          cd test
          npm ci
          bash run-all.sh
      - name: Installer into a staging directory
        run: DESTDIR="$RUNNER_TEMP/stage" bash install.sh
      - name: Browser for the preview
        run: python -m playwright install --with-deps chromium
      - name: Preview in a browser (no JavaScript errors, no sideways scrolling on a phone) and screenshots
        run: |
          python tools/preview/build.py
          python tools/preview/shoot.py test/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/
