# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=cockpit-image-update-monitor
SUMMARY="Cockpit page for Docker image updates"
DESCRIPTION="For every running Docker container: the version the compose file asks for, the version that runs and the newest version. Updates from Cockpit with a database dump first, a rollback copy of the old image and a rollback at the push of a button. Diun and a version radar find new versions."
HOMEPAGE=https://github.com/Azentrius/cockpit-image-update-monitor
MAINTAINER="Azentrius <support@azentrius.de>"
LICENSE="Apache-2.0 AND OFL-1.1 AND CC-BY-4.0"

# Up to 0.12 the package was called cockpit-image-updates; installing this one removes it.
CONFLICTS=cockpit-image-updates

# One dependency per line. Docker, Diun and skopeo are set up from the page.
DEB_DEPENDS="cockpit-bridge
python3"
RPM_REQUIRES="cockpit-bridge
python3"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/cockpit/image-updates
/usr/lib/cockpit-image-updates
/usr/lib/systemd/system/diun-radar.service
/usr/lib/systemd/system/diun-radar.timer
/usr/lib/systemd/system/diun-cleanup.service
/usr/lib/systemd/system/diun-cleanup.timer
/usr/share/metainfo/de.azentrius.image_updates.metainfo.xml
/usr/share/doc/cockpit-image-update-monitor"
